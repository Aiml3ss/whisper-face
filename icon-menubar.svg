<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- parrot, upright, no tile: reads clearly at 18px -->
  <g transform="rotate(24 128 128)">
    <path d="M78 186 C46 164 36 120 56 86 C73 56 110 42 142 52
             C169 61 186 84 186 111 C186 155 154 189 110 196
             C122 208 139 215 156 215 C129 230 92 222 78 186 Z"
          fill="url(#body)"/>
    <path d="M142 52 C164 42 184 47 194 62 C184 82 167 89 150 84
             C155 72 152 59 142 52 Z" fill="#fbbf24"/>
    <!-- happy closed eye -->
    <path d="M124 72 Q140 85 156 72" stroke="#0f172a" stroke-width="9"
          stroke-linecap="round" fill="none"/>
    <!-- slim wing raised to the beak: shhh -->
    <path d="M104 176 C90 140 106 102 149 90
             C155 96 155 105 148 111
             C130 122 121 146 121 172 Z" fill="#047857"/>
  </g>

  <!-- soft whisper puffs -->
  <g stroke="#2dd4bf" stroke-linecap="round" fill="none">
    <path d="M206 86 L222 77" stroke-width="13" opacity="0.95"/>
    <path d="M215 103 L235 99" stroke-width="13" opacity="0.6"/>
    <circle cx="233" cy="64" r="8" fill="#2dd4bf" stroke="none" opacity="0.5"/>
