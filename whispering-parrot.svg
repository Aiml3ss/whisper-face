<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#134e4a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- rounded app tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>

  <!-- whispering parrot: upright, wing to beak, content closed eye -->
  <g transform="rotate(24 128 128)">
    <path d="M96 178 C70 160 62 124 78 96 C92 71 122 60 148 68
             C170 75 184 94 184 116 C184 152 158 180 122 186
             C132 196 146 202 160 202 C138 214 108 208 96 178 Z"
          fill="url(#body)"/>
    <path d="M148 68 C166 60 182 64 190 76 C182 92 168 98 154 94
             C158 84 156 74 148 68 Z" fill="#fbbf24"/>
    <!-- happy closed eye -->
    <path d="M133 82 Q146 93 159 82" stroke="#0f172a" stroke-width="7"
          stroke-linecap="round" fill="none"/>
    <!-- slim wing raised to the beak: shhh -->
    <path d="M118 164 C106 134 120 104 152 95
             C157 100 157 108 151 113
             C136 123 130 141 130 162 Z" fill="#047857"/>
  </g>

  <!-- soft whisper puffs (quiet, drifting) -->
  <g stroke="#5eead4" stroke-linecap="round" fill="none">
    <path d="M204 94 L217 87" stroke-width="8" opacity="0.9"/>
    <path d="M212 109 L229 106" stroke-width="8" opacity="0.55"/>
    <circle cx="227" cy="78" r="5" fill="#5eead4" stroke="none" opacity="0.4"/>
  </g>
</svg>
