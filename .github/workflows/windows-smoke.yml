name: Windows smoke test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-runtime:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      # Every pull request, not just every release: the lock is what stands
      # between a contributor and an unreviewed package.
      - name: Verify the lock matches the declared dependencies
        run: uv lock --check --script dictate.py
      - name: Validate locked Windows environment
        run: uv sync --locked --script dictate.py
      - name: Import Windows runtime
        run: uv run --locked --script dictate.py --platform-smoke-test
      - name: Run platform-independent tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          uv run tests/test_parrot_core.py
          uv run tests/test_voice_compiler.py
          uv run tests/test_consequence_routing.py
          uv run tests/test_cleanup_circuit_breaker.py
          uv run tests/test_benchmark_voice_compiler.py
          uv run tests/test_benchmark_consequence_routing.py
          uv run tests/test_benchmark_cleanup_latency.py
          uv run tests/test_cleanup_proof_recovery.py
          uv run tests/test_quality_gate.py
          uv run quality_gate.py
          uv run tests/test_benchmark_cleanup_proof_recovery.py
          uv run tests/test_benchmark_asr.py
          uv run tests/test_benchmark_macos_asr_warm_path.py
          uv run tests/test_performance_lab.py
          uv run tests/test_dictate.py
          uv run tests/test_gui_settings_runtime.py
          uv run tests/test_insertion_integrity.py
          uv run tests/test_benchmark_insertion_reliability.py
          uv run tests/test_compatibility_fingerprint.py
          uv run tests/test_voice_input_protocol.py
          uv run tests/test_acoustic_keyword_memory.py
          uv run tests/test_acoustic_keyword_bias_evaluation.py
          uv run tests/test_acoustic_keyword_activation.py
          uv run tests/test_acoustic_calibration.py
          uv run tests/test_acoustic_calibration_activation.py
          uv run tests/test_measurement_mode.py
          uv run tests/test_benchmark_acoustic_calibration.py
          uv run tests/test_delayed_cleanup_merge.py
          uv run tests/test_macos_delayed_cleanup_destination.py
          uv run tests/test_model_wallet.py
          uv run tests/test_model_wallet_shadow.py
          uv run tests/test_model_readiness_evidence.py
          uv run tests/test_point_and_speak_resolver.py
          uv run tests/test_drop_to_target.py
          uv run tests/test_macos_drop_to_target_snapshot.py
          uv run tests/test_voice_objects.py
          uv run tests/test_spoken_edit_commands_runtime.py
          uv run tests/test_voice_inbox.py
          uv run tests/test_demonstration_drafts.py
          uv run tests/test_competitor_benchmark.py
          uv run tests/test_public_scorecard.py
          uv run tests/test_personal_regression.py
          uv run tests/test_support_bundle.py
          uv run tests/test_whisper_face_gui.py
          uv run tests/test_whisper_face_characters.py
          uv run tests/test_network_egress.py
          uv run tests/test_supply_chain_integrity.py
          uv run tests/test_installers.py
          uv run tests/test_repository_governance.py
          uv run tests/test_macos_distribution.py
          uv run tests/test_windows_distribution.py
          uv run tests/test_safe_update_advisor.py
          uv run tests/test_side_by_side_update.py
          uv run tests/test_self_update.py
      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $Source = Get-Content -Raw .\setup.ps1
          [void][scriptblock]::Create($Source)

      # Parsing only proves the file is syntactically valid. Windows users run
      # it under Windows PowerShell 5.1, where Set-StrictMode and native-command
      # error handling both differ from pwsh, and until now not one line of it
      # had ever been executed anywhere. Every invocation below changes nothing
      # on the runner.
      - name: Run the installer's no-change paths under Windows PowerShell 5.1
        shell: powershell
        run: |
          function Invoke-Installer([string[]]$InstallerArgs) {
            # Relaxed on purpose: a native command that writes to stderr with
            # its streams merged is a terminating error under "Stop", which
            # would fail this step for output the installer meant to print.
            $previous = $ErrorActionPreference
            $ErrorActionPreference = "Continue"
            try {
              $text = & powershell.exe -NoProfile -ExecutionPolicy Bypass `
                -File .\setup.ps1 @InstallerArgs 2>&1 | Out-String
              return [pscustomobject]@{ Code = $LASTEXITCODE; Output = $text }
            } finally {
              $ErrorActionPreference = $previous
            }
          }

          $help = Invoke-Installer @("--help")
          if ($help.Code -ne 0) { throw "--help exited $($help.Code)" }
          if ($help.Output -notmatch "Usage: ") { throw "--help printed no usage" }

          # A dry-run uninstall prints a plan and changes nothing, which makes
          # it safe here and runs most of the script's runtime helpers.
          $plan = Invoke-Installer @("--uninstall")
          if ($plan.Code -ne 0) { throw "--uninstall exited $($plan.Code)" }
          if ($plan.Output -notmatch "dry run") { throw "--uninstall changed something" }
          if ($plan.Output -match "would remove.*scheduled task") {
            throw "--uninstall plans to remove a task this runner never installed"
          }

          function Assert-Rejected([string[]]$InstallerArgs) {
            $rejected = Invoke-Installer $InstallerArgs
            if ($rejected.Code -eq 0) {
              throw "setup.ps1 $($InstallerArgs -join ' ') should have been rejected"
            }
          }
          Assert-Rejected @("--nonsense")
          Assert-Rejected @("--uninstall", "--verify")
          Assert-Rejected @("--yes")

          # A failing run has to end with the banner naming the log, because
          # that file is all a user has to send back after an install fails.
          $verify = Invoke-Installer @("--verify")
          if ($verify.Code -eq 0) { throw "--verify passed with nothing installed" }
          if ($verify.Output -notmatch "Whisper Face setup failed") {
            throw "a failing run printed no failure banner"
          }
          if (-not (Test-Path .\install.log)) { throw "no install.log was written" }
