name: macOS release gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-release-gate:
    # The full release gate, including the macOS-only suites, on a hosted Mac
    # for every pull request. The command list is read from AGENTS.md at run
    # time rather than copied here, so this job cannot drift from it.
    #
    # macos-15 is the oldest image GitHub still hosts, and so the closest to
    # the macOS 14 minimum the installer accepts. GitHub retired the macos-14
    # image on 2 November 2026; a job that names it fails before it starts.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The governance suite replays history from the MIT boundary commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Run every release gate command listed in AGENTS.md
        env:
          # The interpreter an install runs on: setup.sh and setup.ps1 pin
          # 3.12, and a fresh Mac has no other Python 3.12, so uv installs its
          # own. Unpinned, uv took the runner's Homebrew framework Python,
          # which the networkless worker's sandbox cannot start.
          UV_PYTHON: "3.12"
          UV_PYTHON_PREFERENCE: only-managed
        run: |
          python3 - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          text = Path("AGENTS.md").read_text(encoding="utf-8")
          marker = "Run the repository release gates before declaring completion:"
          block = text.split(marker, 1)[1].split("```sh", 1)[1].split("```", 1)[0]
          commands = [line.strip() for line in block.splitlines() if line.strip()]
          if len(commands) < 50:
              sys.exit(f"found only {len(commands)} gate commands in AGENTS.md")
          failed = []
          for command in commands:
              print(f"::group::{command}", flush=True)
              status = subprocess.run(command, shell=True).returncode
              print("::endgroup::", flush=True)
              if status:
                  print(f"::error title=Release gate failed::{command} exited {status}",
                        flush=True)
                  failed.append(command)
          print(f"{len(commands) - len(failed)} of {len(commands)} gate commands passed")
          sys.exit(1 if failed else 0)
          PY
      - name: Build the speech runtime the installer builds, and check what it links
        # setup.sh builds native/ParrotSpeechRuntime on every Mac install and
        # stops if it does not compile, but no gate command can build Swift.
        # It has no package dependencies, so this fetches nothing and needs
        # no model. The binary must link no networking library and import no
        # symbol that reaches the network, starts a program, changes a file
        # or looks a class or symbol up by name.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/speech-runtime"
          swift build -c release --package-path native/ParrotSpeechRuntime \
            --scratch-path "$scratch"
          binary="$scratch/release/parrot-speech-runtime"
          linked="$(otool -L "$binary")"
          imported="$(nm -u "$binary")"
          printf '%s\n' "$linked"
          bad="$(printf '%s\n' "$linked" \
            | grep -E 'CFNetwork|/Network\.framework|libcurl' || true)"
          bad="$bad$(printf '%s\n' "$imported" | grep -Ex '_(socket|connect|getaddrinfo|gethostbyname|open|openat|fopen|creat|unlink|unlinkat|remove|rename|renameat|rmdir|mkdir|truncate|ftruncate|posix_spawn|posix_spawnp|execve|execv|execvp|fork|system|popen|dlopen|dlsym|NSClassFromString|NSSelectorFromString|objc_getClass|objc_lookUpClass)' || true)"
          bad="$bad$(printf '%s\n' "$imported" \
            | grep -E 'URLSession|URLConnection|URLRequest|NWConnection|NSTask' || true)"
          if [ -n "$bad" ]; then
            echo "::error title=Speech runtime reach::$(printf '%s' "$bad" | tr '\n' ' ')"
            exit 1
          fi
          echo "speech runtime: built; it links and imports nothing that reaches the network or changes a file"
